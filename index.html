<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IST Clock</title>
  <link href="https://fonts.googleapis.com/css2?family=Playwrite+RO:wght@100..400&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background-color: black;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playwrite RO', cursive;
      color: white;
      font-size: 10em;
    }
  </style>
</head>
<body>
  <div id="clock">Loading...</div>

  <script>
    function updateISTTime() {
      let now = new Date();
      let utc = now.getTime() + now.getTimezoneOffset() * 60000;
      let ist = new Date(utc + (5.5 * 3600000));
      let hours = ist.getHours();
      let minutes = ist.getMinutes();
      let ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;
      minutes = minutes < 10 ? '0' + minutes : minutes;
	  let seconds = ist.getSeconds();
	  seconds = seconds < 10 ? '0' + seconds : seconds;
	  document.getElementById("clock").innerHTML = `${hours}:${minutes}:${seconds}&nbsp;${ampm}`;
    }

    updateISTTime();
    setInterval(updateISTTime, 1000); // optional: update every second
  </script>
</body>
</html>
